services:
  cap:
    build:
      # Build the fork's own image: the repository root is the build context
      # because standalone/Dockerfile copies standalone/ (and only standalone/,
      # see standalone/Dockerfile.dockerignore).
      context: ..
      dockerfile: standalone/Dockerfile
    image: priestess-verification
    container_name: priestess-verification
    ports:
      - "3000:3000"
    environment:
      ADMIN_KEY: your_secret_password
      REDIS_URL: redis://valkey:6379
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9-alpine
    container_name: priestess-verification-valkey
    volumes:
      - valkey-data:/data
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  valkey-data:
