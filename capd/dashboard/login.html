<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in to Cap</title>
    <link rel="icon" href="./public/logo-small.webp" />
    <script>
      (() => {
        let pref = "system";
        try {
          pref = localStorage.getItem("cap_theme") || "system";
        } catch {}
        const dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <noscript>
      <style>
        @media (prefers-color-scheme: dark) {
          .no-script {
            background: #18181b;
            color: #a1a1aa;
          }
        }
      </style>
      <p class="no-script grid min-h-dvh place-items-center bg-sidebar p-6 text-sm text-muted-foreground">Turn on JavaScript to sign in to Cap.</p>
    </noscript>
    <div id="app"></div>
    <script type="module" src="./src/login.js"></script>
  </body>
</html>
