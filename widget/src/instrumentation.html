<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
</head>
<body>
<script>
(() => {
  let active = false;
  window.addEventListener("message", async (event) => {
    if (active || event.source !== window.parent) return;
    const data = event.data;
    if (!data || data.type !== "cap:instr:start" || typeof data.nonce !== "string" || typeof data.script !== "string") return;
    active = true;
    try {
      (0, eval)(data.script);
      if (typeof window.onload === "function") await window.onload(new Event("load"));
    } catch {
      window.parent.postMessage({ type: "cap:error", nonce: data.nonce }, "*");
    }
  });
})();
</script>
</body>
</html>
